id: acp-v1
name: Agent Communication Protocol (Crush ACP)
version: 0.1.0
description: >
  Conformance tests for the Crush Agent Communication Protocol (ACP).
  Tests the HTTP REST transport covering health checks, agent discovery,
  synchronous/asynchronous/streaming run modes, input validation,
  run cancellation, session management, and event retrieval.
source_url: https://github.com/charmcli/crush
transport: http-rest

test_cases:
  # ──────────────────────────────────────────────
  # Category: health
  # ──────────────────────────────────────────────

  - id: ping
    name: Ping Health Check
    description: >
      GET /ping returns the text body "pong" with HTTP 200,
      confirming the ACP server is alive.
    severity: required
    category: health
    timeout: 5s
    tags:
      - health
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/ping"
      - action: expect
        expect:
          http_status: 200
          body: "pong"

  - id: ping-content-type
    name: Ping Content-Type
    description: >
      GET /ping returns Content-Type text/plain.
    severity: required
    category: health
    timeout: 5s
    tags:
      - health
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/ping"
      - action: expect
        expect:
          http_status: 200
          headers:
            Content-Type: "text/plain*"

  # ──────────────────────────────────────────────
  # Category: discovery
  # ──────────────────────────────────────────────

  - id: agents-list
    name: List Agents
    description: >
      GET /agents returns a JSON object with an "agents" array
      containing at least one AgentManifest.
    severity: required
    category: discovery
    timeout: 5s
    tags:
      - discovery
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/agents"
      - action: expect
        expect:
          http_status: 200
          body:
            agents: "*"

  - id: agent-manifest-fields
    name: Agent Manifest Required Fields
    description: >
      Each AgentManifest returned by GET /agents contains the required
      fields: name, description, input_content_types, output_content_types.
    severity: required
    category: discovery
    timeout: 5s
    tags:
      - discovery
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/agents"
      - action: expect
        expect:
          http_status: 200
          body:
            agents:
              - name: "*"
                description: "*"
                input_content_types: "*"
                output_content_types: "*"

  - id: agent-by-name
    name: Get Agent by Name
    description: >
      GET /agents/{name} returns the AgentManifest for a known agent.
    severity: required
    category: discovery
    timeout: 5s
    tags:
      - discovery
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/agents/crush"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "crush"

  - id: agent-not-found
    name: Agent Not Found
    description: >
      GET /agents/{name} returns 404 when the agent does not exist.
    severity: required
    category: discovery
    timeout: 5s
    tags:
      - discovery
      - negative
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/agents/nonexistent_agent_that_does_not_exist"
      - action: expect
        expect:
          http_status: 404

  # ──────────────────────────────────────────────
  # Category: runs-sync
  # ──────────────────────────────────────────────

  - id: create-run-sync
    name: Create Synchronous Run
    description: >
      POST /runs with mode "sync" blocks until the agent completes
      and returns a Run object with status "completed" and output messages.
    severity: required
    category: runs-sync
    timeout: 30s
    tags:
      - runs
      - sync
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"

  - id: run-has-required-fields
    name: Run Response Has Required Fields
    description: >
      A completed synchronous run response includes agent_name, run_id,
      session_id, status, output, and created_at.
    severity: required
    category: runs-sync
    timeout: 30s
    tags:
      - runs
      - sync
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            agent_name: "crush"
            run_id: "*"
            session_id: "*"
            status: "completed"
            output: "*"
            created_at: "*"

  - id: run-output-has-agent-message
    name: Run Output Contains Agent Message
    description: >
      The output array of a completed run contains at least one message
      with role "agent".
    severity: required
    category: runs-sync
    timeout: 30s
    tags:
      - runs
      - sync
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            output:
              - role: "agent"

  - id: run-message-has-parts
    name: Agent Message Has Parts
    description: >
      Each agent message in the run output has a parts array where each
      part contains content_type and content fields.
    severity: required
    category: runs-sync
    timeout: 30s
    tags:
      - runs
      - sync
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            output:
              - role: "agent"
                parts:
                  - content_type: "*"
                    content: "*"

  # ──────────────────────────────────────────────
  # Category: runs-async
  # ──────────────────────────────────────────────

  - id: create-run-async
    name: Create Asynchronous Run
    description: >
      POST /runs with mode "async" returns HTTP 202 with a Run object
      whose status is "created" or "in-progress".
    severity: required
    category: runs-async
    timeout: 30s
    tags:
      - runs
      - async
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "async"
      - action: expect
        expect:
          http_status: 202
          body:
            run_id: "*"

  - id: poll-run-status
    name: Poll Run Status
    description: >
      GET /runs/{run_id} returns the current state of an async run,
      including a valid status field.
    severity: required
    category: runs-async
    timeout: 30s
    tags:
      - runs
      - async
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "async"
      - action: expect
        expect:
          http_status: 202
          body:
            run_id: "*"
      - action: send
        payload:
          http_method: GET
          path: "/runs/{run_id}"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "*"

  - id: poll-until-complete
    name: Poll Until Run Completes
    description: >
      Repeatedly polling GET /runs/{run_id} eventually returns a run
      with status "completed".
    severity: required
    category: runs-async
    timeout: 60s
    tags:
      - runs
      - async
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "async"
      - action: expect
        expect:
          http_status: 202
          body:
            run_id: "*"
      - action: wait
        payload:
          duration: "1s"
      - action: send
        payload:
          http_method: GET
          path: "/runs/{run_id}"
          poll:
            interval: "2s"
            max_attempts: 15
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"

  - id: run-completed-has-output
    name: Completed Async Run Has Output
    description: >
      Once an async run reaches status "completed", its output array
      contains at least one agent message with non-empty parts.
    severity: required
    category: runs-async
    timeout: 60s
    tags:
      - runs
      - async
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "async"
      - action: expect
        expect:
          http_status: 202
          body:
            run_id: "*"
      - action: wait
        payload:
          duration: "1s"
      - action: send
        payload:
          http_method: GET
          path: "/runs/{run_id}"
          poll:
            interval: "2s"
            max_attempts: 15
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
            output:
              - role: "agent"
                parts:
                  - content_type: "*"
                    content: "*"

  # ──────────────────────────────────────────────
  # Category: runs-stream
  # ──────────────────────────────────────────────

  - id: create-run-stream
    name: Create Streaming Run
    description: >
      POST /runs with mode "stream" returns an NDJSON response body
      containing newline-delimited JSON events.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          body_format: "ndjson"

  - id: stream-has-run-created
    name: Stream Contains run.created Event
    description: >
      The NDJSON stream from a streaming run includes a "run.created"
      event near the beginning of the stream.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          ndjson_contains:
            - type: "run.created"

  - id: stream-has-message-parts
    name: Stream Contains message.part Events
    description: >
      The NDJSON stream includes at least one "message.part" event
      carrying content from the agent.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          ndjson_contains:
            - type: "message.part"
              part:
                content: "*"

  - id: stream-has-run-completed
    name: Stream Ends With run.completed Event
    description: >
      The NDJSON stream terminates with a "run.completed" event
      indicating the run finished successfully.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          ndjson_last:
            type: "run.completed"

  - id: stream-x-run-id-header
    name: Stream Response Has X-Run-ID Header
    description: >
      The streaming response includes an X-Run-ID header identifying
      the run being streamed.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          headers:
            X-Run-ID: "*"

  - id: stream-content-type
    name: Stream Response Content-Type
    description: >
      The Content-Type header of a streaming response is
      application/x-ndjson.
    severity: required
    category: runs-stream
    timeout: 30s
    tags:
      - runs
      - streaming
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
            Accept: "application/x-ndjson"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "stream"
      - action: expect
        expect:
          http_status: 200
          headers:
            Content-Type: "application/x-ndjson*"

  # ──────────────────────────────────────────────
  # Category: validation
  # ──────────────────────────────────────────────

  - id: empty-input-rejected
    name: Empty Input Rejected
    description: >
      POST /runs with an empty input array returns HTTP 400.
    severity: required
    category: validation
    timeout: 5s
    tags:
      - validation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input: []
            mode: "sync"
      - action: expect
        expect:
          http_status: 400

  - id: wrong-agent-name
    name: Unknown Agent Name Rejected
    description: >
      POST /runs with a nonexistent agent_name returns HTTP 404.
    severity: required
    category: validation
    timeout: 5s
    tags:
      - validation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "nonexistent_agent_that_does_not_exist"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 404

  - id: empty-content-rejected
    name: Empty Message Content Rejected
    description: >
      POST /runs where input messages have empty text content
      returns HTTP 400.
    severity: required
    category: validation
    timeout: 5s
    tags:
      - validation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: ""
            mode: "sync"
      - action: expect
        expect:
          http_status: 400

  - id: invalid-json-rejected
    name: Malformed JSON Rejected
    description: >
      POST /runs with a malformed JSON body returns HTTP 400.
    severity: required
    category: validation
    timeout: 5s
    tags:
      - validation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          raw_body: "{invalid json that is not valid"
      - action: expect
        expect:
          http_status: 400

  # ──────────────────────────────────────────────
  # Category: cancellation
  # ──────────────────────────────────────────────

  - id: cancel-active-run
    name: Cancel Active Run
    description: >
      POST /runs/{run_id}/cancel on an in-progress async run
      transitions it to "cancelled" status.
    severity: recommended
    category: cancellation
    timeout: 30s
    tags:
      - cancellation
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Write a very long essay about the history of computing"
            mode: "async"
      - action: expect
        expect:
          http_status: 202
          body:
            run_id: "*"
      - action: send
        payload:
          http_method: POST
          path: "/runs/{run_id}/cancel"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "cancelled"

  - id: cancel-completed-run
    name: Cancel Completed Run Returns 409
    description: >
      POST /runs/{run_id}/cancel on a run that already completed
      returns HTTP 409 Conflict.
    severity: required
    category: cancellation
    timeout: 30s
    tags:
      - cancellation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
            run_id: "*"
      - action: send
        payload:
          http_method: POST
          path: "/runs/{run_id}/cancel"
      - action: expect
        expect:
          http_status: 409

  - id: cancel-nonexistent-run
    name: Cancel Nonexistent Run Returns 404
    description: >
      POST /runs/{nonexistent}/cancel returns HTTP 404.
    severity: required
    category: cancellation
    timeout: 5s
    tags:
      - cancellation
      - negative
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs/nonexistent-run-id-00000000/cancel"
      - action: expect
        expect:
          http_status: 404

  # ──────────────────────────────────────────────
  # Category: sessions
  # ──────────────────────────────────────────────

  - id: session-persistence
    name: Session Persistence Across Runs
    description: >
      Two runs sharing the same session_id can access shared context.
      The second run references information from the first.
    severity: required
    category: sessions
    timeout: 60s
    tags:
      - sessions
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Remember the code word: TORTUGA"
            session_id: "session-persistence-test"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
            session_id: "session-persistence-test"
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "What is the code word I told you?"
            session_id: "session-persistence-test"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
            session_id: "session-persistence-test"

  - id: session-export
    name: Export Session
    description: >
      GET /sessions/{session_id}/export returns the session snapshot
      data for a session that has been used.
    severity: recommended
    category: sessions
    timeout: 30s
    tags:
      - sessions
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            session_id: "session-export-test"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
      - action: send
        payload:
          http_method: GET
          path: "/sessions/session-export-test/export"
      - action: expect
        expect:
          http_status: 200

  - id: session-import
    name: Import Session
    description: >
      POST /sessions/import with a valid session snapshot succeeds,
      allowing subsequent runs to use the imported context.
    severity: recommended
    category: sessions
    timeout: 30s
    tags:
      - sessions
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            session_id: "session-import-test"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
            status: "completed"
      - action: send
        payload:
          http_method: GET
          path: "/sessions/session-import-test/export"
      - action: expect
        expect:
          http_status: 200
      - action: send
        payload:
          http_method: POST
          path: "/sessions/import"
          headers:
            Content-Type: "application/json"
          body_from_previous: true
      - action: expect
        expect:
          http_status: 200

  # ──────────────────────────────────────────────
  # Category: events
  # ──────────────────────────────────────────────

  - id: events-list
    name: List Run Events
    description: >
      GET /runs/{run_id}/events returns an array of events for
      a completed run.
    severity: required
    category: events
    timeout: 30s
    tags:
      - events
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/runs"
          headers:
            Content-Type: "application/json"
          body:
            agent_name: "crush"
            input:
              - role: "user"
                parts:
                  - content_type: "text/plain"
                    content: "Say hello"
            mode: "sync"
      - action: expect
        expect:
          http_status: 200
          body:
