id: arp-http-v0.3
name: "ARP HTTP Compliance"
version: 0.3.0
description: >
  HTTP conformance tests for the Agent Registry Protocol (ARP) v0.3.
  Tests the REST API for workspace/project management and the A2A proxy
  for agent discovery, card enrichment, routing, and error handling.
  Designed to run against a live awesometree-daemon on localhost:9099.

  Tests are split into categories:
    - api-workspaces: REST CRUD for workspaces
    - api-projects:   REST CRUD for projects
    - a2a-proxy:      A2A agent discovery and proxy endpoints
    - a2a-proxy-routing: Skill-based message routing
    - openapi:        OpenAPI spec endpoint

  Tests that require running agents use severity "optional" since
  agent availability depends on runtime state.
source_url: https://github.com/aleksclark/spec-torture
transport: http-rest

test_cases:
  # ===========================================================================
  # Category: openapi — Schema endpoint
  # ===========================================================================
  - id: openapi-spec-endpoint
    name: GET /api/openapi.json Returns OpenAPI Spec
    description: >
      The OpenAPI specification endpoint returns a valid OpenAPI 3.x document
      describing the REST API surface.
    severity: required
    category: openapi
    timeout: 10s
    tags:
      - openapi
      - rest-api
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/openapi.json"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  # ===========================================================================
  # Category: api-workspaces — Workspace CRUD
  # ===========================================================================
  - id: api-workspaces-list
    name: GET /api/workspaces Returns JSON Array
    description: >
      GET /api/workspaces returns a JSON array of workspace objects.
    severity: required
    category: api-workspaces
    timeout: 10s
    tags:
      - api-workspaces
      - rest-api
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/workspaces"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: api-workspaces-list-content-type
    name: Workspaces Response Has JSON Content-Type
    description: >
      The Content-Type header for /api/workspaces must be application/json.
    severity: required
    category: api-workspaces
    timeout: 10s
    tags:
      - api-workspaces
      - headers
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/workspaces"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: api-workspaces-get-nonexistent
    name: GET /api/workspaces/{name} Returns 404 for Unknown
    description: >
      GET /api/workspaces/{name} with a nonexistent workspace returns 404.
    severity: required
    category: api-workspaces
    timeout: 10s
    tags:
      - api-workspaces
      - errors
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/workspaces/nonexistent-workspace-00000"
      - action: expect
        expect:
          http_status: 404

  # ===========================================================================
  # Category: api-projects — Project CRUD
  # ===========================================================================
  - id: api-projects-list
    name: GET /api/projects Returns JSON Array
    description: >
      GET /api/projects returns a JSON array of project objects.
    severity: required
    category: api-projects
    timeout: 10s
    tags:
      - api-projects
      - rest-api
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/projects"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: api-projects-get-nonexistent
    name: GET /api/projects/{name} Returns 404 for Unknown
    description: >
      GET /api/projects/{name} with a nonexistent project returns 404.
    severity: required
    category: api-projects
    timeout: 10s
    tags:
      - api-projects
      - errors
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/api/projects/nonexistent-project-00000"
      - action: expect
        expect:
          http_status: 404

  # ===========================================================================
  # Category: a2a-proxy — Discovery & Agent Cards
  # ===========================================================================
  - id: proxy-list-agents
    name: GET /a2a/agents Returns 200
    description: >
      GET /a2a/agents returns HTTP 200 with a JSON array. The array may
      be empty if no agents are running, but the endpoint must exist and
      respond with a valid JSON array.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - discovery
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: proxy-discover-endpoint
    name: GET /a2a/discover Returns 200
    description: >
      GET /a2a/discover returns HTTP 200 with a JSON array of agents.
      Supports optional query filters: workspace, capability, status.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - discovery
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/discover"
      - action: expect
        expect:
          http_status: 200

  - id: proxy-discover-filter-workspace
    name: GET /a2a/discover Accepts workspace Filter
    description: >
      GET /a2a/discover?workspace=X filters agents by workspace name.
      A nonexistent workspace returns an empty array (not an error).
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - discovery
      - filtering
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/discover?workspace=nonexistent-ws-00000"
      - action: expect
        expect:
          http_status: 200

  - id: proxy-discover-filter-capability
    name: GET /a2a/discover Accepts capability Filter
    description: >
      GET /a2a/discover?capability=X filters agents by skill tag.
      A nonexistent capability returns an empty array (not an error).
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - discovery
      - filtering
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/discover?capability=nonexistent-cap-00000"
      - action: expect
        expect:
          http_status: 200

  - id: proxy-nonexistent-agent-card-404
    name: Agent Card for Nonexistent Agent Returns 404
    description: >
      GET /a2a/agents/{nonexistent}/.well-known/agent-card.json returns 404.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - errors
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/nonexistent-agent-00000/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 404

  - id: proxy-nonexistent-agent-message-404
    name: SendMessage to Nonexistent Agent Returns 404
    description: >
      POST /a2a/agents/{nonexistent}/message:send returns 404.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - errors
      - messaging
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/nonexistent-agent-00000/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "Should 404."
      - action: expect
        expect:
          http_status: 404

  - id: proxy-nonexistent-agent-task-404
    name: GetTask for Nonexistent Agent Returns 404
    description: >
      GET /a2a/agents/{nonexistent}/tasks/{id} returns 404.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - errors
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/nonexistent-agent-00000/tasks/fake-task-id"
      - action: expect
        expect:
          http_status: 404

  - id: proxy-nonexistent-agent-cancel-404
    name: CancelTask for Nonexistent Agent Returns 404
    description: >
      POST /a2a/agents/{nonexistent}/tasks/{id}:cancel returns 404.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - errors
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/nonexistent-agent-00000/tasks/fake-task-id:cancel"
      - action: expect
        expect:
          http_status: 404

  - id: proxy-nonexistent-agent-stream-404
    name: Streaming to Nonexistent Agent Returns 404
    description: >
      POST /a2a/agents/{nonexistent}/message:stream returns 404.
    severity: required
    category: a2a-proxy
    timeout: 10s
    tags:
      - a2a-proxy
      - errors
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/nonexistent-agent-00000/message:stream"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "Should 404."
      - action: expect
        expect:
          http_status: 404

  # ===========================================================================
  # Category: a2a-proxy-routing — Skill-based routing
  # ===========================================================================
  - id: proxy-route-endpoint-accepts-post
    name: POST /a2a/route/message:send Accepts POST
    description: >
      The routing endpoint exists and accepts POST requests. It returns
      either 200 (match found), 400 (bad request), or 404 (no match) —
      not 405 or 500.
    severity: required
    category: a2a-proxy-routing
    timeout: 10s
    tags:
      - a2a-proxy-routing
      - routing
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "Test routing."
            routing:
              tags: ["test"]
      - action: expect
        expect:
          http_status: 404

  - id: proxy-route-no-match-404
    name: Route With No Matching Agent Returns 404
    description: >
      POST /a2a/route/message:send with tags matching no agent returns 404.
    severity: required
    category: a2a-proxy-routing
    timeout: 10s
    tags:
      - a2a-proxy-routing
      - errors
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "No agent has this tag."
            routing:
              tags: ["nonexistent-capability-00000"]
      - action: expect
        expect:
          http_status: 404

  # ===========================================================================
  # Category: a2a-proxy — Chained tests (require running agents)
  # These discover an agent first, then test proxy behavior.
  # Severity is "optional" since they depend on agents being alive.
  # ===========================================================================
  - id: proxy-list-then-card
    name: List Agents Then Fetch Agent Card
    description: >
      GET /a2a/agents, then use the first agent's ID to fetch its enriched
      card via the well-known endpoint. Validates proxy card enrichment.
      Requires at least one running agent.
    severity: optional
    category: a2a-proxy
    timeout: 30s
    tags:
      - a2a-proxy
      - discovery
      - agent-card
      - chained
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/$prev.body.0.metadata.arp.agent_id/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            supportedInterfaces: "*"
            metadata:
              arp:
                agent_id: "*"
                workspace: "*"
                project: "*"
                template: "*"
                status: "*"
                direct_url: "*"
                started_at: "*"

  - id: proxy-card-interface-points-to-proxy
    name: Enriched AgentCard Interface URL Points to Proxy
    description: >
      The enriched card's supportedInterfaces[0].url should point to the
      ARP proxy path (/a2a/agents/{id}/), not the agent's direct URL.
    severity: optional
    category: a2a-proxy
    timeout: 30s
    tags:
      - a2a-proxy
      - agent-card
      - enrichment
      - chained
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/$prev.body.0.metadata.arp.agent_id/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            supportedInterfaces: "*"
            metadata:
              arp:
                direct_url: "*"

  - id: proxy-send-message
    name: Proxy SendMessage to Running Agent
    description: >
      Discover an agent via /a2a/agents, then POST /a2a/agents/{id}/message:send.
      The proxy forwards to the agent's A2A endpoint and returns the response.
    severity: optional
    category: a2a-proxy
    timeout: 120s
    tags:
      - a2a-proxy
      - messaging
      - chained
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/$prev.body.0.metadata.arp.agent_id/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "Hello via ARP proxy."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-by-skill-tags
    name: Route by AgentSkill.tags
    description: >
      POST /a2a/route/message:send routes a message to an agent matching
      the requested skill tags. Requires at least one agent with matching tags.
    severity: optional
    category: a2a-proxy-routing
    timeout: 60s
    tags:
      - a2a-proxy-routing
      - routing
      - skills
      - chained
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text: "Route to any agent."
      - action: expect
        expect:
          http_status: 200
          body: "*"
