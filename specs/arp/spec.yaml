  # ===========================================================================
  # Category: a2a-proxy
  # ===========================================================================
  - id: proxy-list-agents
    name: GET /a2a/agents Lists All Ready AgentCards
    description: >
      GET /a2a/agents returns an array of A2A AgentCard objects for all
      agents with status ready (or busy). Each AgentCard includes name,
      version, supportedInterfaces, and skills.
    severity: required
    category: a2a-proxy
    timeout: 30s
    tags:
      - a2a-proxy
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents"
      - action: expect
        expect:
          http_status: 200
          body_is_array: true

  - id: proxy-agent-card-well-known
    name: GET /a2a/agents/{id}/.well-known/agent-card.json Returns Enriched AgentCard
    description: >
      GET /a2a/agents/{agent_id}/.well-known/agent-card.json returns the
      agent's A2A AgentCard enriched with metadata.arp containing agent_id,
      workspace, project, template, status, direct_url, and started_at.
    severity: required
    category: a2a-proxy
    timeout: 30s
    tags:
      - a2a-proxy
      - discovery
      - agent-card
      - enrichment
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/{agent_id}/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            supportedInterfaces: "*"
            metadata:
              arp:
                agent_id: "*"
                workspace: "*"
                status: "*"
                direct_url: "*"

  - id: proxy-agent-card-interface-url
    name: Enriched AgentCard supportedInterfaces[0].url Points to Proxy
    description: >
      The enriched AgentCard served through the proxy has
      supportedInterfaces[0].url pointing to the proxied endpoint
      (http://host:port/a2a/agents/{id}), not the agent's direct URL.
    severity: required
    category: a2a-proxy
    timeout: 30s
    tags:
      - a2a-proxy
      - agent-card
      - enrichment
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/{agent_id}/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            supportedInterfaces: "*"
            metadata:
              arp:
                direct_url: "*"

  - id: proxy-send-message
    name: POST /a2a/agents/{id}/message:send Proxies SendMessage
    description: >
      POST /a2a/agents/{agent_id}/message:send proxies an A2A
      SendMessageRequest to the target agent and returns the
      SendMessageResponse (either a Task or a Message).
    severity: required
    category: a2a-proxy
    timeout: 60s
    tags:
      - a2a-proxy
      - messaging
      - a2a
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Hello via proxy."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-send-streaming-message
    name: POST /a2a/agents/{id}/message:stream Proxies SSE
    description: >
      POST /a2a/agents/{agent_id}/message:stream proxies an A2A
      SendStreamingMessage request and returns a Server-Sent Events
      (SSE) stream of StreamResponse events.
    severity: optional
    category: a2a-proxy
    timeout: 60s
    tags:
      - a2a-proxy
      - streaming
      - a2a
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:stream"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Stream via proxy."
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "text/event-stream"

  - id: proxy-get-task
    name: GET /a2a/agents/{id}/tasks/{tid} Proxies GetTask
    description: >
      GET /a2a/agents/{agent_id}/tasks/{task_id} proxies an A2A GetTask
      request to the target agent and returns the Task object.
    severity: required
    category: a2a-proxy
    timeout: 30s
    tags:
