  # ===========================================================================
  # Category: a2a-proxy-routing
  # ===========================================================================
  - id: proxy-route-by-agent-id
    name: Route by agent_id (Exact Match)
    description: >
      The ARP proxy resolves agents by agent_id as the first priority.
      A request to /a2a/agents/{agent_id}/message:send with a valid
      agent_id is routed to the correct agent.
    severity: required
    category: a2a-proxy-routing
    timeout: 30s
    tags:
      - a2a-proxy-routing
      - routing
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route by exact agent_id."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-by-name
    name: Route by AgentCard.name
    description: >
      The ARP proxy resolves agents by AgentCard.name as the second
      priority. A request using the agent's name in the path is routed
      to the matching agent.
    severity: required
    category: a2a-proxy-routing
    timeout: 30s
    tags:
      - a2a-proxy-routing
      - routing
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_name}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route by agent name."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-by-workspace-name
    name: Route by workspace/instance_name Composite
    description: >
      The ARP proxy resolves agents by {workspace}/{instance_name}
      composite key as the third priority.
    severity: required
    category: a2a-proxy-routing
    timeout: 30s
    tags:
      - a2a-proxy-routing
      - routing
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{workspace}/{instance_name}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route by workspace/name composite."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-by-skill-tags
    name: Route by AgentSkill.tags via POST /a2a/route/message:send
    description: >
      POST /a2a/route/message:send routes a SendMessage request to an
      agent whose AgentCard.skills[].tags match the request's routing
      criteria. Prefers agents with status ready.
    severity: recommended
    category: a2a-proxy-routing
    timeout: 30s
    tags:
      - a2a-proxy-routing
      - routing
      - skills
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route to an agent with coding skills."
            routing:
              tags: ["coding"]
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-prefers-ready
    name: Proxy Prefers Ready Agents Over Busy
    description: >
      When multiple agents match a routing request, the proxy prefers
      agents with status ready over those with status busy.
    severity: recommended
    category: a2a-proxy-routing
    timeout: 60s
    tags:
      - a2a-proxy-routing
      - routing
      - load-balancing
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route to any available agent."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-route-no-match-error
    name: Route With No Matching Agent Returns Error
    description: >
      POST /a2a/route/message:send with routing criteria that match no
      agent returns an appropriate error.
    severity: required
    category: a2a-proxy-routing
    timeout: 10s
    tags:
      - a2a-proxy-routing
      - routing
      - errors
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/route/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Route to nonexistent capability."
            routing:
              tags: ["nonexistent-capability-00000"]
      - action: expect
        expect:
          http_status: 404

  # ===========================================================================
  # Category: auth-tokens
  # ===========================================================================
  - id: token-create-requires-admin
    name: token/create Requires Admin Permission
    description: >
      token/create is only available to callers with admin permission.
      A caller with project or session permission receives an error.
    severity: required
    category: auth-tokens
    timeout: 10s
    tags:
      - auth-tokens
      - auth
      - permissions
    steps:
      - action: mcp_tool_call
        auth:
          permission: "session"
        payload:
          tool: "token/create"
          arguments:
            subject: "test-user"
            scope: "*"
            permission: "session"
      - action: expect
        expect:
          error: "*"

  - id: token-create-with-admin
    name: token/create Succeeds With Admin Permission
    description: >
      token/create with admin permission creates a new ARP token with
      the specified subject, scope, and permission.
    severity: required
    category: auth-tokens
    timeout: 10s
    tags:
      - auth-tokens
      - auth
      - permissions
    steps:
      - action: mcp_tool_call
        auth:
          permission: "admin"
        payload:
          tool: "token/create"
          arguments:
            subject: "test-user"
            scope: "*"
            permission: "project"
      - action: expect
        expect:
          result:
            id: "*"
            subject: "test-user"
            scope: "*"
            permission: "project"

  - id: session-scoped-sees-own-agents
    name: Session-Scoped Token Only Sees Own-Session Agents
    description: >
      A token with session permission can only see agents that were
      spawned in the same session (same session_id). agent/list returns
      only own-session agents.
    severity: required
    category: auth-tokens
    timeout: 60s
    tags:
      - auth-tokens
      - auth
      - session
      - scoping
    steps:
      - action: mcp_tool_call
        auth:
          permission: "session"
          scope: ["test-auth-project"]
        payload:
          tool: "agent/list"
          arguments: {}
      - action: expect
        expect:
          result_all_match:
            session_id: "$auth.session_id"

  - id: project-scoped-sees-all-in-project
    name: Project-Scoped Token Sees All Agents in Scoped Projects
    description: >
      A token with project permission can see all agents in its scoped
      projects, regardless of session_id.
    severity: required
    category: auth-tokens
    timeout: 60s
    tags:
      - auth-tokens
      - auth
      - project
      - scoping
    steps:
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["test-auth-project"]
        payload:
          tool: "agent/list"
          arguments: {}
      - action: expect
        expect:
          result_is_array: true

  - id: project-scoped-cannot-see-unscoped
    name: Project-Scoped Token Cannot See Agents in Unscoped Projects
    description: >
      A token scoped to project A cannot see or interact with agents
      in project B. workspace/list filtered to the unscoped project
      returns empty results or an error.
    severity: required
    category: auth-tokens
    timeout: 10s
    tags:
      - auth-tokens
      - auth
      - scoping
      - errors
    steps:
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["project-a"]
        payload:
          tool: "workspace/list"
          arguments:
            project: "project-b"
      - action: expect
        expect:
          result_is_array: true
          result_count: 0

  - id: scope-narrowing-on-spawn
    name: Scope Narrowing on agent/spawn (Child ⊆ Parent)
    description: >
      When agent/spawn includes a scope parameter, the child agent's
      token scope must be a subset of the caller's scope. Attempting
      to widen scope beyond the caller's scope returns an error.
    severity: required
    category: auth-tokens
    timeout: 60s
    tags:
      - auth-tokens
      - auth
      - scoping
      - spawn
    steps:
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["project-a"]
        payload:
          tool: "project/register"
          arguments:
            name: "project-a"
            repo: "/tmp/project-a"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result: "*"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-scope-narrow-ws"
            project: "project-a"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["project-a"]
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-scope-narrow-ws"
            template: "test-agent"
            scope: ["project-a", "project-b"]
      - action: expect
        expect:
          error: "*"

  - id: permission-cannot-escalate
    name: Permission Can Only Lower (No Escalation)
    description: >
      A caller with project permission cannot spawn an agent with admin
      permission. The permission field on agent/spawn can only be equal
      to or lower than the caller's permission level.
    severity: required
    category: auth-tokens
    timeout: 60s
    tags:
      - auth-tokens
      - auth
      - permissions
      - spawn
    steps:
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["test-escalate-project"]
        payload:
          tool: "project/register"
          arguments:
            name: "test-escalate-project"
            repo: "/tmp/test-escalate-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          error: "*"

  - id: localhost-admin-when-enabled
    name: Localhost Connections Get Admin When localhost_admin=true
    description: >
      When the ARP server is configured with localhost_admin=true,
      connections from localhost are treated as admin with scope "*".
      This allows local users full control without explicit tokens.
    severity: recommended
    category: auth-tokens
    timeout: 10s
    tags:
      - auth-tokens
      - auth
      - localhost
    steps:
      - action: mcp_tool_call
        auth:
          source: "localhost"
        payload:
          tool: "project/list"
          arguments: {}
      - action: expect
        expect:
          result_is_array: true

  - id: token-create-with-expiry
    name: token/create With Expiry
    description: >
      token/create with expires_in_seconds creates a token that expires
      after the specified duration. The returned token includes
      expires_at field.
    severity: optional
    category: auth-tokens
    timeout: 10s
    tags:
      - auth-tokens
      - auth
      - expiry
    steps:
      - action: mcp_tool_call
        auth:
          permission: "admin"
        payload:
          tool: "token/create"
          arguments:
            subject: "test-expiry-user"
            scope: "*"
            permission: "session"
            expires_in_seconds: 3600
      - action: expect
        expect:
          result:
            id: "*"
            expires_at: "*"

  # ===========================================================================
  # Category: auth-session-isolation
  # ===========================================================================
  - id: session-isolation-separate-tokens
    name: Two Session-Scoped Tokens Cannot See Each Other's Agents
    description: >
      Two different session-scoped tokens, each having spawned agents,
      cannot see each other's agents via agent/list. Each token's
      agent/list returns only its own session's agents.
    severity: required
    category: auth-session-isolation
    timeout: 120s
    tags:
      - auth-session-isolation
      - auth
      - session
      - isolation
    steps:
      - action: mcp_tool_call
        auth:
          token: "session-token-a"
          permission: "session"
          scope: ["test-isolation-project"]
        payload:
          tool: "agent/list"
          arguments: {}
      - action: expect
        expect:
          result_all_match:
            session_id: "$auth.session_id"
      - action: mcp_tool_call
        auth:
          token: "session-token-b"
          permission: "session"
          scope: ["test-isolation-project"]
        payload:
          tool: "agent/list"
          arguments: {}
      - action: expect
        expect:
          result_all_match:
            session_id: "$auth.session_id"

  - id: session-agent-list-only-own
    name: Session-Scoped agent/list Only Returns Own-Session Agents
    description: >
      A session-scoped token calling agent/list sees only agents that
      share its session_id, even when other agents exist in the same
      workspace belonging to different sessions.
    severity: required
    category: auth-session-isolation
    timeout: 60s
    tags:
      - auth-session-isolation
      - auth
      - session
    steps:
      - action: mcp_tool_call
        auth:
          permission: "session"
          scope: ["test-isolation-project"]
        payload:
          tool: "agent/list"
          arguments: {}
      - action: expect
        expect:
          result_all_match:
            session_id: "$auth.session_id"

  - id: session-stop-foreign-agent-403
    name: Session-Scoped agent/stop on Foreign-Session Agent Returns 403
    description: >
      A session-scoped token attempting to stop an agent belonging to
      a different session receives a permission error (403 equivalent).
    severity: required
    category: auth-session-isolation
    timeout: 30s
    tags:
      - auth-session-isolation
      - auth
      - session
      - errors
    steps:
      - action: mcp_tool_call
        auth:
          token: "session-token-a"
          permission: "session"
        payload:
          tool: "agent/stop"
          arguments:
            agent_id: "{foreign_session_agent_id}"
      - action: expect
        expect:
          error: "*"

  - id: session-propagates-through-spawn-chain
    name: Session Propagates Through Spawn Chain
    description: >
      When an agent spawns a child agent, the child inherits the parent's
      session_id. A grandchild agent (spawned by the child) also inherits
      the same session_id, creating a session tree.
    severity: required
    category: auth-session-isolation
    timeout: 120s
    tags:
      - auth-session-isolation
      - auth
      - session
      - spawn-chain
    steps:
      - action: mcp_tool_call
        auth:
          permission: "project"
          scope: ["test-chain-project"]
        payload:
          tool: "project/register"
          arguments:
            name: "test-chain-project"
            repo: "/tmp/test-chain-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-chain-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-chain-ws"
            project: "test-chain-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-chain-ws"
            template: "test-agent"
            name: "parent-agent"
      - action: expect
        expect:
          result:
            id: "*"
            session_id: "*"

  - id: session-proxy-enforces-boundary
    name: Proxied A2A With Session Token Enforces Session Boundary
    description: >
      When accessing the A2A proxy with a session-scoped bearer token,
      only agents within the token's session are accessible. Requests to
      agents outside the session return 403.
    severity: required
    category: auth-session-isolation
    timeout: 30s
    tags:
      - auth-session-isolation
      - auth
      - session
      - a2a-proxy
    steps:
      - action: send
        auth:
          token: "session-token-a"
          permission: "session"
        payload:
          http_method: POST
          path: "/a2a/agents/{foreign_session_agent_id}/message:send"
          headers:
            content-type: "application/json"
            authorization: "Bearer {session_token_a}"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Try to message foreign session agent."
      - action: expect
        expect:
          http_status: 403

  # ===========================================================================
  # Category: direct-vs-proxy
  # ===========================================================================
  - id: direct-serves-a2a-without-arp-auth
    name: Direct URL Serves Standard A2A Without ARP Auth
    description: >
      The agent's direct URL (agent port) serves standard A2A v1.0
      endpoints. No ARP token or authorization header is required for
      direct access — ARP scoping does not apply to the direct path.
    severity: required
    category: direct-vs-proxy
    timeout: 30s
    tags:
      - direct-vs-proxy
      - a2a
      - direct-access
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
          target: "direct"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            supportedInterfaces: "*"

  - id: direct-send-message-no-auth
    name: Direct SendMessage Works Without ARP Token
    description: >
      POST /message:send on the agent's direct URL works without any
      ARP authorization. The agent processes the request using standard
      A2A v1.0 semantics.
    severity: required
    category: direct-vs-proxy
    timeout: 60s
    tags:
      - direct-vs-proxy
      - a2a
      - direct-access
      - messaging
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/message:send"
          target: "direct"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Direct message without ARP auth."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-enforces-token-scope
    name: Proxy URL Enforces Token Scope
    description: >
      The proxied A2A endpoint (/a2a/agents/{id}/...) enforces ARP
      token scope. A request with an invalid or missing token is
      rejected with an appropriate HTTP error (401 or 403).
    severity: required
    category: direct-vs-proxy
    timeout: 10s
    tags:
      - direct-vs-proxy
      - a2a-proxy
      - auth
      - scoping
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
            authorization: "Bearer invalid-token-00000"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Should be rejected."
      - action: expect
        expect:
          http_status_one_of: [401, 403]

  - id: proxy-card-has-direct-url
    name: Proxy AgentCard Has metadata.arp.direct_url
    description: >
      The AgentCard served through the proxy includes
      metadata.arp.direct_url giving clients the option to bypass
      the proxy and connect directly to the agent's A2A endpoint.
    severity: required
    category: direct-vs-proxy
    timeout: 30s
    tags:
      - direct-vs-proxy
      - agent-card
      - enrichment
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/{agent_id}/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            metadata:
              arp:
                direct_url: "*"

  - id: direct-bypasses-arp-scoping
    name: Direct Access Bypasses ARP Scoping (By Design)
    description: >
      Direct access to an agent's port bypasses ARP scope enforcement
      entirely. This is by design — ARP scopes protect the management
      plane (proxied path and MCP tools), not the data plane (direct
      agent-to-agent communication).
    severity: required
    category: direct-vs-proxy
    timeout: 60s
    tags:
      - direct-vs-proxy
      - a2a
      - direct-access
      - security
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/message:send"
          target: "direct"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Direct access ignores ARP scoping."
      - action: expect
        expect:
          http_status: 200
          body: "*"

  - id: proxy-requires-auth-header
    name: Proxy Requires Authorization Header
    description: >
      The proxied A2A endpoint requires a valid Authorization header
      with a bearer token. Requests without the header are rejected.
    severity: required
    category: direct-vs-proxy
    timeout: 10s
    tags:
      - direct-vs-proxy
      - a2a-proxy
      - auth
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "No auth header."
      - action: expect
        expect:
          http_status_one_of: [401, 403]

  - id: direct-get-task-no-auth
    name: Direct GetTask Works Without ARP Token
    description: >
      GET /tasks/{id} on the agent's direct URL works without ARP
      authorization, serving standard A2A v1.0 task retrieval.
    severity: required
    category: direct-vs-proxy
    timeout: 30s
    tags:
      - direct-vs-proxy
      - a2a
      - direct-access
      - task
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/message:send"
          target: "direct"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Create task for direct GetTask test."
      - action: expect
        expect:
          http_status: 200
          body: "*"
      - action: send
        payload:
          http_method: GET
          path: "/tasks/$prev.body.task.id"
          target: "direct"
      - action: expect
        expect:
          http_status: 200
          body:
            id: "*"
            status: "*"
