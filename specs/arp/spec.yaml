id: arp-v0.3
name: Agent Registry Protocol
version: 0.3.0
description: >
  Conformance tests for the Agent Registry Protocol (ARP) v0.3.
  ARP is an MCP server that manages the full lifecycle of AI agents within
  workspaces and provides a unified registry for A2A agent discovery and
  communication. Tests cover the MCP tool interface (project, workspace, agent
  lifecycle, messaging), the A2A proxy/registry HTTP endpoints, proxy routing
  behavior, token-based auth with scoped permissions, and session isolation.
  Normative source: arp-spec/ (overview.md, tools-*.md, identity-and-scopes.md).
  Transport: MCP tools for lifecycle/messaging, HTTP+JSON for A2A proxy endpoints.
source_url: https://github.com/nicholasgasior/spec-torture
transport: mcp-and-http

test_cases:
  # ===========================================================================
  # Category: mcp-project
  # ===========================================================================
  - id: project-list-returns-array
    name: project/list Returns Array
    description: >
      project/list with no arguments returns an array of Project objects.
      Each Project has at minimum a name and repo field.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/list"
          arguments: {}
      - action: expect
        expect:
          result_is_array: true

  - id: project-register-creates-project
    name: project/register Creates a Project
    description: >
      project/register with name and repo creates a new project.
      The returned Project object contains the provided name and repo.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-001"
            repo: "/tmp/test-repo-001"
      - action: expect
        expect:
          result:
            name: "test-project-001"
            repo: "/tmp/test-repo-001"

  - id: project-register-with-agents
    name: project/register With Agent Templates
    description: >
      project/register with an agents array registers agent templates.
      Each AgentTemplate has at minimum a name and command field.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
      - agent-template
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-tmpl"
            repo: "/tmp/test-repo-tmpl"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
                a2a:
                  name: "Test Agent"
                  description: "A test agent template"
                  skills:
                    - id: "test"
                      name: "Test"
                      description: "Test skill"
                      tags: ["testing"]
      - action: expect
        expect:
          result:
            name: "test-project-tmpl"
            agents: "*"

  - id: project-register-appears-in-list
    name: Registered Project Appears in project/list
    description: >
      After project/register, the newly registered project appears in
      the project/list results.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-list"
            repo: "/tmp/test-repo-list"
      - action: expect
        expect:
          result:
            name: "test-project-list"
      - action: mcp_tool_call
        payload:
          tool: "project/list"
          arguments: {}
      - action: expect
        expect:
          result_contains:
            name: "test-project-list"

  - id: project-unregister-removes
    name: project/unregister Removes a Project
    description: >
      project/unregister removes a previously registered project.
      After unregistering, the project no longer appears in project/list.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-unreg"
            repo: "/tmp/test-repo-unreg"
      - action: expect
        expect:
          result:
            name: "test-project-unreg"
      - action: mcp_tool_call
        payload:
          tool: "project/unregister"
          arguments:
            name: "test-project-unreg"
      - action: expect
        expect:
          result: "*"
      - action: mcp_tool_call
        payload:
          tool: "project/list"
          arguments: {}
      - action: expect
        expect:
          result_not_contains:
            name: "test-project-unreg"

  - id: project-register-duplicate-error
    name: project/register Duplicate Name Errors
    description: >
      Registering a project with a name that already exists returns an error.
      The server must not silently overwrite an existing project.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
      - errors
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-dup"
            repo: "/tmp/test-repo-dup"
      - action: expect
        expect:
          result:
            name: "test-project-dup"
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-dup"
            repo: "/tmp/test-repo-dup-2"
      - action: expect
        expect:
          error: "*"

  - id: project-unregister-nonexistent-error
    name: project/unregister Nonexistent Project Errors
    description: >
      Unregistering a project name that does not exist returns an error.
    severity: required
    category: mcp-project
    timeout: 10s
    tags:
      - mcp-project
      - project
      - errors
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/unregister"
          arguments:
            name: "nonexistent-project-00000"
      - action: expect
        expect:
          error: "*"

  - id: project-unregister-with-active-workspaces-error
    name: project/unregister With Active Workspaces Errors
    description: >
      Unregistering a project that has active workspaces with running agents
      returns an error. The project must remain registered until workspaces
      are destroyed or agents stopped.
    severity: recommended
    category: mcp-project
    timeout: 30s
    tags:
      - mcp-project
      - project
      - workspace
      - errors
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-project-active"
            repo: "/tmp/test-repo-active"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-project-active"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "ws-active"
            project: "test-project-active"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "project/unregister"
          arguments:
            name: "test-project-active"
      - action: expect
        expect:
          error: "*"

  # ===========================================================================
  # Category: mcp-workspace
  # ===========================================================================
  - id: workspace-create-returns-active
    name: workspace/create Returns Active Workspace
    description: >
      workspace/create returns a Workspace object with status "active" and
      an empty agents array when no auto_agents are specified.
    severity: required
    category: mcp-workspace
    timeout: 30s
    tags:
      - mcp-workspace
      - workspace
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-project"
            repo: "/tmp/test-ws-repo"
      - action: expect
        expect:
          result:
            name: "test-ws-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-create"
            project: "test-ws-project"
      - action: expect
        expect:
          result:
            name: "test-ws-create"
            project: "test-ws-project"
            status: "active"
            agents: []

  - id: workspace-create-has-dir
    name: workspace/create Returns Directory Path
    description: >
      The created Workspace object includes a dir field with an absolute
      path to the workspace directory.
    severity: required
    category: mcp-workspace
    timeout: 30s
    tags:
      - mcp-workspace
      - workspace
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-dir-project"
            repo: "/tmp/test-ws-dir-repo"
      - action: expect
        expect:
          result:
            name: "test-ws-dir-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-dir"
            project: "test-ws-dir-project"
      - action: expect
        expect:
          result:
            name: "test-ws-dir"
            dir: "*"
            created_at: "*"

  - id: workspace-list-returns-array
    name: workspace/list Returns Array
    description: >
      workspace/list with no arguments returns an array of Workspace objects.
    severity: required
    category: mcp-workspace
    timeout: 10s
    tags:
      - mcp-workspace
      - workspace
    steps:
      - action: mcp_tool_call
        payload:
          tool: "workspace/list"
          arguments: {}
      - action: expect
        expect:
          result_is_array: true

  - id: workspace-list-filter-by-project
    name: workspace/list Filters by Project
    description: >
      workspace/list with project filter returns only workspaces belonging
      to the specified project.
    severity: required
    category: mcp-workspace
    timeout: 30s
    tags:
      - mcp-workspace
      - workspace
      - filtering
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-filter-a"
            repo: "/tmp/test-ws-filter-a"
      - action: expect
        expect:
          result:
            name: "test-ws-filter-a"
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-filter-b"
            repo: "/tmp/test-ws-filter-b"
      - action: expect
        expect:
          result:
            name: "test-ws-filter-b"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "ws-filter-a"
            project: "test-ws-filter-a"
      - action: expect
        expect:
          result:
            project: "test-ws-filter-a"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "ws-filter-b"
            project: "test-ws-filter-b"
      - action: expect
        expect:
          result:
            project: "test-ws-filter-b"
      - action: mcp_tool_call
        payload:
          tool: "workspace/list"
          arguments:
            project: "test-ws-filter-a"
      - action: expect
        expect:
          result_all_match:
            project: "test-ws-filter-a"

  - id: workspace-list-filter-by-status
    name: workspace/list Filters by Status
    description: >
      workspace/list with status filter returns only workspaces matching
      the specified status (active or inactive).
    severity: required
    category: mcp-workspace
    timeout: 10s
    tags:
      - mcp-workspace
      - workspace
      - filtering
    steps:
      - action: mcp_tool_call
        payload:
          tool: "workspace/list"
          arguments:
            status: "active"
      - action: expect
        expect:
          result_all_match:
            status: "active"

  - id: workspace-get-returns-full
    name: workspace/get Returns Full Workspace
    description: >
      workspace/get returns a full Workspace object including agents array
      with resolved agent details.
    severity: required
    category: mcp-workspace
    timeout: 30s
    tags:
      - mcp-workspace
      - workspace
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-get-project"
            repo: "/tmp/test-ws-get-repo"
      - action: expect
        expect:
          result:
            name: "test-ws-get-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-get"
            project: "test-ws-get-project"
      - action: expect
        expect:
          result:
            name: "test-ws-get"
      - action: mcp_tool_call
        payload:
          tool: "workspace/get"
          arguments:
            name: "test-ws-get"
      - action: expect
        expect:
          result:
            name: "test-ws-get"
            project: "test-ws-get-project"
            status: "active"
            agents: "*"
            dir: "*"
            created_at: "*"

  - id: workspace-get-nonexistent-error
    name: workspace/get Nonexistent Workspace Errors
    description: >
      workspace/get with a name that does not exist returns an error.
    severity: required
    category: mcp-workspace
    timeout: 10s
    tags:
      - mcp-workspace
      - workspace
      - errors
    steps:
      - action: mcp_tool_call
        payload:
          tool: "workspace/get"
          arguments:
            name: "nonexistent-workspace-00000"
      - action: expect
        expect:
          error: "*"

  - id: workspace-destroy-stops-agents
    name: workspace/destroy Stops Agents and Cleans Up
    description: >
      workspace/destroy stops all agents in the workspace, removes the
      workspace from state, and (by default) removes the git worktree
      directory. After destroy, the workspace no longer appears in
      workspace/list.
    severity: required
    category: mcp-workspace
    timeout: 60s
    tags:
      - mcp-workspace
      - workspace
      - lifecycle
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-destroy-project"
            repo: "/tmp/test-ws-destroy-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-ws-destroy-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-destroy"
            project: "test-ws-destroy-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "workspace/destroy"
          arguments:
            name: "test-ws-destroy"
      - action: expect
        expect:
          result: "*"
      - action: mcp_tool_call
        payload:
          tool: "workspace/list"
          arguments: {}
      - action: expect
        expect:
          result_not_contains:
            name: "test-ws-destroy"

  - id: workspace-create-auto-agents
    name: workspace/create With auto_agents Spawns Agents
    description: >
      workspace/create with auto_agents parameter spawns the listed agent
      templates automatically. The returned Workspace includes those agents
      in the agents array.
    severity: recommended
    category: mcp-workspace
    timeout: 60s
    tags:
      - mcp-workspace
      - workspace
      - agent
      - auto-spawn
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-auto-project"
            repo: "/tmp/test-ws-auto-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-ws-auto-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-auto"
            project: "test-ws-auto-project"
            auto_agents: ["test-agent"]
      - action: expect
        expect:
          result:
            name: "test-ws-auto"
            status: "active"
            agents: "*"

  - id: workspace-destroy-keep-worktree
    name: workspace/destroy With keep_worktree Preserves Directory
    description: >
      workspace/destroy with keep_worktree=true removes the workspace
      from ARP state and stops agents but preserves the git worktree
      directory on disk.
    severity: optional
    category: mcp-workspace
    timeout: 60s
    tags:
      - mcp-workspace
      - workspace
      - lifecycle
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-ws-keep-project"
            repo: "/tmp/test-ws-keep-repo"
      - action: expect
        expect:
          result:
            name: "test-ws-keep-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-ws-keep"
            project: "test-ws-keep-project"
      - action: expect
        expect:
          result:
            name: "test-ws-keep"
            dir: "*"
      - action: mcp_tool_call
        payload:
          tool: "workspace/destroy"
          arguments:
            name: "test-ws-keep"
            keep_worktree: true
      - action: expect
        expect:
          result: "*"

  # ===========================================================================
  # Category: mcp-agent-lifecycle
  # ===========================================================================
  - id: agent-spawn-returns-instance
    name: agent/spawn Returns AgentInstance
    description: >
      agent/spawn returns an AgentInstance object containing id, template,
      workspace, status, port, direct_url, and proxy_url fields.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 60s
    tags:
      - mcp-agent-lifecycle
      - agent
      - spawn
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-spawn-project"
            repo: "/tmp/test-spawn-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-spawn-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-spawn-ws"
            project: "test-spawn-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-spawn-ws"
            template: "test-agent"
      - action: expect
        expect:
          result:
            id: "*"
            template: "test-agent"
            workspace: "test-spawn-ws"
            status: "*"
            port: "*"
            direct_url: "*"
            proxy_url: "*"

  - id: agent-spawn-with-name-override
    name: agent/spawn With Name Override
    description: >
      agent/spawn with a name parameter uses the provided instance name
      instead of the template name.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 60s
    tags:
      - mcp-agent-lifecycle
      - agent
      - spawn
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-spawn-name-project"
            repo: "/tmp/test-spawn-name-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-spawn-name-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-spawn-name-ws"
            project: "test-spawn-name-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-spawn-name-ws"
            template: "test-agent"
            name: "my-custom-agent"
      - action: expect
        expect:
          result:
            id: "*"
            template: "test-agent"

  - id: agent-spawn-with-prompt
    name: agent/spawn With Prompt Sends A2A SendMessage
    description: >
      agent/spawn with a prompt parameter sends an A2A SendMessageRequest
      containing a Message with role ROLE_USER and a single TextPart after
      the agent reaches ready status.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 120s
    tags:
      - mcp-agent-lifecycle
      - agent
      - spawn
      - a2a
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-spawn-prompt-project"
            repo: "/tmp/test-spawn-prompt-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-spawn-prompt-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-spawn-prompt-ws"
            project: "test-spawn-prompt-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-spawn-prompt-ws"
            template: "test-agent"
            prompt: "Hello, initialize yourself."
      - action: expect
        expect:
          result:
            id: "*"
            status: "*"

  - id: agent-spawn-with-scope-narrowing
    name: agent/spawn With Scope Narrows Child Token
    description: >
      agent/spawn with a scope parameter issues a child token to the
      spawned agent with a narrower project scope than the caller's token.
      The scope must be a subset of the caller's scope.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 60s
    tags:
      - mcp-agent-lifecycle
      - agent
      - spawn
      - auth
      - scopes
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-scope-project"
            repo: "/tmp/test-scope-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-scope-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-scope-ws"
            project: "test-scope-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-scope-ws"
            template: "test-agent"
            scope: ["test-scope-project"]
      - action: expect
        expect:
          result:
            id: "*"
            token_id: "*"

  - id: agent-spawn-with-permission
    name: agent/spawn With Permission Sets Child Permission Level
    description: >
      agent/spawn with a permission parameter sets the child agent's
      permission level. The permission can only be equal to or lower
      than the caller's permission (never higher).
    severity: required
    category: mcp-agent-lifecycle
    timeout: 60s
    tags:
      - mcp-agent-lifecycle
      - agent
      - spawn
      - auth
      - permissions
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-perm-project"
            repo: "/tmp/test-perm-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-perm-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-perm-ws"
            project: "test-perm-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-perm-ws"
            template: "test-agent"
            permission: "session"
      - action: expect
        expect:
          result:
            id: "*"
            token_id: "*"

  - id: agent-list-returns-array
    name: agent/list Returns Array of Instances
    description: >
      agent/list returns an array of AgentInstance objects. Each instance
      includes id, template, workspace, status, port, direct_url, and
      proxy_url.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 10s
    tags:
