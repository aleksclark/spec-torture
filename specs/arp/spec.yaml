        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Create a task for proxy GetTask test."
      - action: expect
        expect:
          http_status: 200
          body: "*"
      - action: send
        payload:
          http_method: GET
          path: "/a2a/agents/{agent_id}/tasks/$prev.body.task.id"
      - action: expect
        expect:
          http_status: 200
          body:
            id: "*"
            status: "*"

  - id: proxy-cancel-task
    name: POST /a2a/agents/{id}/tasks/{tid}:cancel Proxies CancelTask
    description: >
      POST /a2a/agents/{agent_id}/tasks/{task_id}:cancel proxies an A2A
      CancelTask request to the target agent.
    severity: recommended
    category: a2a-proxy
    timeout: 60s
    tags:
