          tool: "workspace/create"
          arguments:
            name: "test-hist-ws"
            project: "test-hist-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-hist-ws"
            template: "test-agent"
      - action: expect
        expect:
          result:
            id: "*"
      - action: mcp_tool_call
        payload:
          tool: "agent/task"
          arguments:
            agent_id: "$prev.result.id"
            message: "Track this task."
      - action: expect
        expect:
          result:
            id: "*"
      - action: mcp_tool_call
        payload:
          tool: "agent/task_status"
          arguments:
            agent_id: "$prev.result.agent_id"
            task_id: "$prev.result.id"
            history_length: 2
      - action: expect
        expect:
          result:
            id: "*"
            status: "*"

