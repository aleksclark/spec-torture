  - id: agent-stop-terminates
    name: agent/stop Cancels Working Tasks Then SIGTERM
    description: >
      agent/stop cancels any A2A tasks in WORKING state via CancelTask,
      sends SIGTERM, waits grace period, then SIGKILL if needed. After
      stop, the agent status transitions to stopped.
    severity: required
    category: mcp-agent-lifecycle
    timeout: 60s
    tags:
      - mcp-agent-lifecycle
      - agent
      - stop
      - lifecycle
    steps:
      - action: mcp_tool_call
        payload:
          tool: "project/register"
          arguments:
            name: "test-stop-project"
            repo: "/tmp/test-stop-repo"
            agents:
              - name: "test-agent"
                command: "echo serve"
                port_env: "A2A_PORT"
      - action: expect
        expect:
          result:
            name: "test-stop-project"
      - action: mcp_tool_call
        payload:
          tool: "workspace/create"
          arguments:
            name: "test-stop-ws"
            project: "test-stop-project"
      - action: expect
        expect:
          result:
            status: "active"
      - action: mcp_tool_call
        payload:
          tool: "agent/spawn"
          arguments:
            workspace: "test-stop-ws"
            template: "test-agent"
      - action: expect
        expect:
          result:
            id: "*"
      - action: mcp_tool_call
        payload:
          tool: "agent/stop"
          arguments:
            agent_id: "$prev.result.id"
      - action: expect
        expect:
          result: "*"
      - action: mcp_tool_call
        payload:
          tool: "agent/status"
          arguments:
            agent_id: "$prev.result.id"
      - action: expect
        expect:
          result:
            status: "stopped"

