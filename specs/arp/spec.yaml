      - a2a
    steps:
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/message:send"
          headers:
            content-type: "application/json"
          body:
            message:
              role: "ROLE_USER"
              parts:
                - text_part:
                    text: "Create a task to cancel via proxy."
      - action: expect
        expect:
          http_status: 200
          body: "*"
      - action: send
        payload:
          http_method: POST
          path: "/a2a/agents/{agent_id}/tasks/$prev.body.task.id:cancel"
      - action: expect
        expect:
          http_status: 200

  - id: proxy-nonexistent-agent-404
    name: Proxy Requests to Nonexistent Agent Return 404
    description: >
      A2A proxy requests targeting a nonexistent agent_id return HTTP 404.
    severity: required
    category: a2a-proxy
