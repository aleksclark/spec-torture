id: a2a-v1
name: Agent-to-Agent Protocol
version: 1.0.0
description: >
  Conformance tests for the Agent-to-Agent (A2A) v1.0 protocol.
  Tests JSON-RPC 2.0 over HTTP POST transport, covering agent discovery,
  task lifecycle, messaging, streaming, error handling, and push notifications.
  Normative source: specification/a2a.proto (package lf.a2a.v1).
  JSON-RPC method names: SendMessage, GetTask, CancelTask, SendStreamingMessage.
  Parts use member-based polymorphism (no "kind" discriminator).
  SendMessage may return either a Task or a Message (oneof payload).
source_url: https://github.com/a2aproject/A2A/blob/main/specification/a2a.proto
transport: jsonrpc-http

test_cases:
  # ---------------------------------------------------------------------------
  # Category: discovery
  # ---------------------------------------------------------------------------
  - id: agent-card-well-known
    name: Agent Card Well-Known Endpoint
    description: >
      GET /.well-known/agent-card.json returns a valid AgentCard with the
      v1.0 required fields: name, description, version, supportedInterfaces,
      capabilities, defaultInputModes, defaultOutputModes, and skills.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            version: "*"
            supportedInterfaces: "*"
            skills: "*"

  - id: agent-card-content-type
    name: Agent Card Content-Type
    description: >
      The response to GET /.well-known/agent-card.json must include a
      Content-Type header of application/json.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: agent-card-optional-fields
    name: Agent Card Optional Fields
    description: >
      AgentCard SHOULD include optional fields such as description,
      capabilities, and defaultInputModes for richer discovery metadata.
    severity: recommended
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            description: "*"
            capabilities: "*"

  - id: agent-card-skills
    name: Agent Card Has Skills
    description: >
      AgentCard must include at least one skill with id and name.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            skills: "*"

  - id: agent-card-interfaces
    name: Agent Card Has Supported Interfaces
    description: >
      v1.0 AgentCard must include supportedInterfaces array with at least one
      AgentInterface containing url, protocolBinding, and protocolVersion.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            supportedInterfaces: "*"
            capabilities: "*"
            defaultInputModes: "*"
            defaultOutputModes: "*"

  # ---------------------------------------------------------------------------
  # Category: lifecycle
  # ---------------------------------------------------------------------------
  - id: send-message-basic
    name: SendMessage Returns Valid Response
    description: >
      Send a simple text message. The agent responds with a valid JSON-RPC
      response containing either a Task or a Message (SendMessageResponse
      is a oneof of task or message in the v1.0 proto).
    severity: required
    category: lifecycle
    timeout: 60s
    tags:
      - lifecycle
      - messaging
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-001"
              role: "ROLE_USER"
              parts:
                - text: "Hello, what can you do?"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"

  - id: send-message-response-shape
    name: SendMessage Response Contains Task or Message
    description: >
      SendMessage result must contain either a "task" key (with id, status)
      or a "message" key (with messageId, role, parts). Both are valid per
      the v1.0 proto oneof SendMessageResponse.
    severity: required
    category: lifecycle
    timeout: 60s
    tags:
      - lifecycle
      - messaging
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-shape-001"
              role: "ROLE_USER"
              parts:
                - text: "Tell me something."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"

  - id: get-task
    name: GetTask Returns Task
    description: >
      If SendMessage returns a Task, GetTask with that task ID should return
      the Task object with current status. If SendMessage returns a Message
      instead, GetTask may return a task-not-found error (both are acceptable).
    severity: recommended
    category: lifecycle
    timeout: 60s
    tags:
      - lifecycle
      - task
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-003"
              role: "ROLE_USER"
              parts:
                - text: "Create a task so I can retrieve it."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "GetTask"
          params:
            id: "$prev.result.id"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2

  - id: get-task-not-found
    name: GetTask Not Found Error
    description: >
      GetTask with a nonexistent task ID returns a JSON-RPC error.
    severity: required
    category: lifecycle
    timeout: 10s
    tags:
      - lifecycle
      - task
      - errors
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "GetTask"
          params:
            id: "nonexistent-task-id-00000000"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: "*"
            message: "*"

  - id: cancel-task
    name: CancelTask on Active Task
    description: >
      CancelTask on an active task transitions the task state to CANCELED
      or returns an appropriate error if not supported or if no task was
      created (when SendMessage returns a Message).
    severity: recommended
    category: lifecycle
    timeout: 60s
    tags:
      - lifecycle
      - task
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-cancel"
              role: "ROLE_USER"
              parts:
                - text: "Start a task that I can cancel."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "CancelTask"
          params:
            id: "$prev.result.id"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2

  # ---------------------------------------------------------------------------
  # Category: messaging
  # ---------------------------------------------------------------------------
  - id: message-text-part
    name: Message with Text Part
    description: >
      A Message containing a text part (Part with "text" field set) is
      accepted and processed by the agent. v1.0 Parts use member-based
      polymorphism — the Part type is determined by which oneof field is
      present (text, raw, url, or data), not a "kind" discriminator.
    severity: required
    category: messaging
    timeout: 60s
    tags:
      - messaging
      - parts
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-text-001"
              role: "ROLE_USER"
              parts:
                - text: "This is a plain text message."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"

  - id: message-with-context
    name: Messages Share Context
    description: >
      Two messages sent with the same contextId are treated as part of the
      same conversational context by the agent.
    severity: required
    category: messaging
    timeout: 120s
    tags:
      - messaging
      - context
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-ctx-001"
              role: "ROLE_USER"
              parts:
                - text: "Hello from context test."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "SendMessage"
          params:
            message:
              messageId: "test-ctx-002"
              role: "ROLE_USER"
              contextId: "$prev.result.contextId"
              parts:
                - text: "Follow up message."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2
          result: "*"

  - id: missing-message-id
    name: SendMessage Without MessageId Returns Error
    description: >
      SendMessage without messageId returns a JSON-RPC error. The v1.0 proto
      marks message_id as REQUIRED (google.api.field_behavior), so omitting
      it is an invalid request.
    severity: required
    category: messaging
    timeout: 60s
    tags:
      - messaging
      - errors
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              role: "ROLE_USER"
              parts:
                - text: "No message ID provided."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: -32602
            message: "*"

  # ---------------------------------------------------------------------------
  # Category: streaming
  # ---------------------------------------------------------------------------
  - id: streaming-send
    name: SendStreamingMessage Returns SSE Stream
    description: >
      SendStreamingMessage returns a Server-Sent Events (SSE) stream
      instead of a single JSON-RPC response.
    severity: optional
    category: streaming
    timeout: 60s
    tags:
      - streaming
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendStreamingMessage"
          params:
            message:
              messageId: "test-stream-001"
              role: "ROLE_USER"
              parts:
                - text: "Stream your response to me."
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "text/event-stream"

  - id: streaming-events
    name: Streaming Contains Events
    description: >
      An SSE stream from SendStreamingMessage contains StreamResponse
      events. Each event's result is a oneof of task, message,
      statusUpdate, or artifactUpdate.
    severity: optional
    category: streaming
    timeout: 60s
    tags:
      - streaming
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendStreamingMessage"
          params:
            message:
              messageId: "test-stream-002"
              role: "ROLE_USER"
              parts:
                - text: "Stream a response with status updates."
      - action: expect
        expect:
          sse_event: "*"

  # ---------------------------------------------------------------------------
  # Category: error-handling
  # ---------------------------------------------------------------------------
  - id: jsonrpc-parse-error
    name: JSON-RPC Parse Error
    description: >
      Sending malformed JSON to the JSON-RPC endpoint returns error code
      -32700 (Parse error).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          raw_body: "{invalid json content"
          content_type: "application/json"
      - action: expect
        expect:
          jsonrpc: "2.0"
          error:
            code: -32700
            message: "*"

  - id: jsonrpc-invalid-request
    name: JSON-RPC Invalid Request
    description: >
      Sending a JSON object missing the required "jsonrpc" field returns
      error code -32600 (Invalid Request).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          raw_body: '{"id": 1, "method": "SendMessage", "params": {}}'
          content_type: "application/json"
      - action: expect
        expect:
          jsonrpc: "2.0"
          error:
            code: -32600
            message: "*"

  - id: jsonrpc-method-not-found
    name: JSON-RPC Method Not Found
    description: >
      Sending a request with an unknown method returns error code -32601
      (Method not found).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "NonExistentMethod"
          params: {}
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: -32601
            message: "*"

  - id: missing-required-params
    name: Missing Required Params Error
    description: >
      SendMessage with empty params (no message) returns error code -32602
      (Invalid params).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params: {}
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: -32602
            message: "*"

  # ---------------------------------------------------------------------------
  # Category: push-notifications
  # ---------------------------------------------------------------------------
  - id: push-notification-not-supported
    name: Push Notification Config When Unsupported
    description: >
      CreateTaskPushNotificationConfig returns a JSON-RPC error when the
      agent does not support push notifications (capabilities.pushNotifications
      is false or absent).
    severity: optional
    category: push-notifications
    timeout: 60s
    tags:
      - push-notifications
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-push-001"
              role: "ROLE_USER"
              parts:
                - text: "Perform a task."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "CreateTaskPushNotificationConfig"
          params:
            taskId: "$prev.result.id"
            pushNotificationConfig:
              url: "https://example.com/callback"
              authentication:
                scheme: "Bearer"
                credentials: "test-token"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2
          error:
            code: "*"
            message: "*"
