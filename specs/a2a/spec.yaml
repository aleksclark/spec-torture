id: a2a-v1
name: Agent-to-Agent Protocol
version: 1.0.0
description: >
  Conformance tests for the Agent-to-Agent (A2A) v1.0 protocol.
  Tests JSON-RPC 2.0 over HTTP POST transport, covering agent discovery,
  task lifecycle, messaging, streaming, error handling, and push notifications.
  Uses A2A v1.0 method names (SendMessage, GetTask, etc.).
source_url: https://google.github.io/A2A/latest/
transport: jsonrpc-http

test_cases:
  # ---------------------------------------------------------------------------
  # Category: discovery
  # ---------------------------------------------------------------------------
  - id: agent-card-well-known
    name: Agent Card Well-Known Endpoint
    description: >
      GET /.well-known/agent-card.json returns a valid AgentCard with the
      required fields: name, version, url, and skills array.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            version: "*"
            url: "*"
            skills: "*"

  - id: agent-card-content-type
    name: Agent Card Content-Type
    description: >
      The response to GET /.well-known/agent-card.json must include a
      Content-Type header of application/json.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "application/json"

  - id: agent-card-optional-fields
    name: Agent Card Optional Fields
    description: >
      AgentCard SHOULD include optional fields such as description,
      capabilities, and provider for richer discovery metadata.
    severity: recommended
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            name: "*"
            description: "*"
            capabilities: "*"

  - id: agent-card-skills
    name: Agent Card Has Skills
    description: >
      AgentCard must include at least one skill with id and name.
    severity: required
    category: discovery
    timeout: 10s
    tags:
      - discovery
      - agent-card
    steps:
      - action: send
        payload:
          http_method: GET
          path: "/.well-known/agent-card.json"
      - action: expect
        expect:
          http_status: 200
          body:
            skills: "*"

  # ---------------------------------------------------------------------------
  # Category: lifecycle
  # ---------------------------------------------------------------------------
  - id: send-message-basic
    name: SendMessage Returns Valid Response
    description: >
      Send a simple text message. The agent responds with a valid JSON-RPC
      response containing a result object.
    severity: required
    category: lifecycle
    timeout: 15s
    tags:
      - lifecycle
      - messaging
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-001"
              role: "user"
              parts:
                - kind: "text"
                  text: "Hello, what can you do?"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"
            contextId: "*"
            status:
              state: "*"

  - id: send-message-creates-task
    name: SendMessage Creates Task
    description: >
      SendMessage returns a Task object with valid id, contextId, and status.
    severity: required
    category: lifecycle
    timeout: 15s
    tags:
      - lifecycle
      - task
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-002"
              role: "user"
              parts:
                - kind: "text"
                  text: "Perform a multi-step task for me."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            kind: "task"
            id: "*"
            contextId: "*"
            status:
              state: "*"

  - id: get-task
    name: GetTask Returns Task
    description: >
      GetTask with a valid task ID returns the Task object with current
      status and metadata.
    severity: required
    category: lifecycle
    timeout: 15s
    tags:
      - lifecycle
      - task
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-003"
              role: "user"
              parts:
                - kind: "text"
                  text: "Create a task so I can retrieve it."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "GetTask"
          params:
            id: "$prev.result.id"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2
          result:
            id: "*"
            status:
              state: "*"

  - id: get-task-not-found
    name: GetTask Not Found Error
    description: >
      GetTask with a nonexistent task ID returns a JSON-RPC error with
      a task-not-found error code.
    severity: required
    category: lifecycle
    timeout: 10s
    tags:
      - lifecycle
      - task
      - errors
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "GetTask"
          params:
            id: "nonexistent-task-id-00000000"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: "*"
            message: "*"

  - id: cancel-task
    name: CancelTask on Active Task
    description: >
      CancelTask on an active task transitions the task state to "canceled"
      or returns an appropriate error if not supported.
    severity: recommended
    category: lifecycle
    timeout: 15s
    tags:
      - lifecycle
      - task
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-msg-cancel"
              role: "user"
              parts:
                - kind: "text"
                  text: "Start a task that I can cancel."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"
            status:
              state: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "CancelTask"
          params:
            id: "$prev.result.id"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2

  # ---------------------------------------------------------------------------
  # Category: messaging
  # ---------------------------------------------------------------------------
  - id: message-text-part
    name: Message with TextPart
    description: >
      A Message containing a text part is accepted and processed by the agent.
    severity: required
    category: messaging
    timeout: 15s
    tags:
      - messaging
      - parts
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-text-001"
              role: "user"
              parts:
                - kind: "text"
                  text: "This is a plain text message."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"

  - id: message-with-context
    name: Messages Share Context
    description: >
      Two messages sent with the same contextId are treated as part of the
      same conversational context by the agent.
    severity: required
    category: messaging
    timeout: 15s
    tags:
      - messaging
      - context
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-ctx-001"
              role: "user"
              parts:
                - kind: "text"
                  text: "Hello from context test."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"
            contextId: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "SendMessage"
          params:
            message:
              messageId: "test-ctx-002"
              role: "user"
              parts:
                - kind: "text"
                  text: "Follow up message."
            contextId: "$prev.result.contextId"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2
          result:
            id: "*"

  # ---------------------------------------------------------------------------
  # Category: streaming
  # ---------------------------------------------------------------------------
  - id: streaming-send
    name: SendStreamingMessage Returns SSE Stream
    description: >
      SendStreamingMessage returns a Server-Sent Events (SSE) stream
      instead of a single JSON-RPC response.
    severity: optional
    category: streaming
    timeout: 30s
    tags:
      - streaming
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendStreamingMessage"
          params:
            message:
              messageId: "test-stream-001"
              role: "user"
              parts:
                - kind: "text"
                  text: "Stream your response to me."
      - action: expect
        expect:
          http_status: 200
          headers:
            content-type: "text/event-stream"

  - id: streaming-events
    name: Streaming Contains Events
    description: >
      An SSE stream from streaming message send contains
      task status or artifact update events.
    severity: optional
    category: streaming
    timeout: 30s
    tags:
      - streaming
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendStreamingMessage"
          params:
            message:
              messageId: "test-stream-002"
              role: "user"
              parts:
                - kind: "text"
                  text: "Stream a task with status updates."
      - action: expect
        expect:
          sse_event:
            taskId: "*"
            status:
              state: "*"

  # ---------------------------------------------------------------------------
  # Category: error-handling
  # ---------------------------------------------------------------------------
  - id: jsonrpc-parse-error
    name: JSON-RPC Parse Error
    description: >
      Sending malformed JSON to the JSON-RPC endpoint returns error code
      -32700 (Parse error).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          raw_body: "{invalid json content"
          content_type: "application/json"
      - action: expect
        expect:
          jsonrpc: "2.0"
          error:
            code: -32700
            message: "*"

  - id: jsonrpc-invalid-request
    name: JSON-RPC Invalid Request
    description: >
      Sending a JSON object missing the required "jsonrpc" field returns
      error code -32600 (Invalid Request).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          raw_body: '{"id": 1, "method": "SendMessage", "params": {}}'
          content_type: "application/json"
      - action: expect
        expect:
          jsonrpc: "2.0"
          error:
            code: -32600
            message: "*"

  - id: jsonrpc-method-not-found
    name: JSON-RPC Method Not Found
    description: >
      Sending a request with an unknown method returns error code -32601
      (Method not found).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "NonExistentMethod"
          params: {}
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: -32601
            message: "*"

  - id: missing-required-params
    name: Missing Required Parameters
    description: >
      SendMessage without a message field returns a JSON-RPC error
      indicating invalid parameters (-32602).
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params: {}
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: -32602
            message: "*"

  - id: missing-message-id
    name: Missing MessageId Returns Error
    description: >
      SendMessage without messageId in the message returns a validation error.
    severity: required
    category: error-handling
    timeout: 10s
    tags:
      - errors
      - jsonrpc
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              role: "user"
              parts:
                - kind: "text"
                  text: "No message ID."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          error:
            code: "*"
            message: "*"

  # ---------------------------------------------------------------------------
  # Category: push-notifications
  # ---------------------------------------------------------------------------
  - id: push-notification-not-supported
    name: Push Notification Config When Unsupported
    description: >
      If the agent does not support push notifications, attempting to set
      a push config returns an appropriate error.
    severity: optional
    category: push-notifications
    timeout: 15s
    tags:
      - push-notifications
    steps:
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 1
          method: "SendMessage"
          params:
            message:
              messageId: "test-push-001"
              role: "user"
              parts:
                - kind: "text"
                  text: "Create a task for push notification testing."
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 1
          result:
            id: "*"
      - action: send
        payload:
          jsonrpc: "2.0"
          id: 2
          method: "CreateTaskPushNotificationConfig"
          params:
            id: "$prev.result.id"
            pushNotificationConfig:
              url: "https://example.com/webhook/a2a-test"
      - action: expect
        expect:
          jsonrpc: "2.0"
          id: 2
