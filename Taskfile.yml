version: '3'

vars:
  SPEC: specs/a2a/spec.yaml
  REPORTS: reports/a2a

tasks:
  build:
    desc: Build spec-torture and a2a-mock binaries
    cmds:
      - go build -o bin/spec-torture ./cmd/spec-torture
      - go build -o bin/a2a-mock ./cmd/a2a-mock
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/spec-torture
      - bin/a2a-mock

  validate:
    desc: Validate all spec files
    deps: [build]
    cmds:
      - ./bin/spec-torture validate specs/a2a/spec.yaml
      - ./bin/spec-torture validate specs/acp/spec.yaml
      - ./bin/spec-torture validate specs/arp/spec-http.yaml

  # ---------------------------------------------------------------------------
  # ARP reference implementation (gRPC server + client libraries)
  # ---------------------------------------------------------------------------

  arp:gen:
    desc: Regenerate gen/arp/v1 from proto/arp/v1 via buf
    cmds:
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate

  arp:build:
    desc: Build the ARP reference server and conformance tool
    cmds:
      - go build -o bin/arp-server ./cmd/arp-server
      - go build -o bin/arp-conformance ./cmd/arp-conformance
    sources:
      - arp/**/*.go
      - cmd/arp-server/**/*.go
      - cmd/arp-conformance/**/*.go
      - gen/**/*.go
    generates:
      - bin/arp-server
      - bin/arp-conformance

  arp:test:
    desc: Run the in-process ARP gRPC conformance suite
    cmds:
      - go test ./arp/...

  torture:arp-reference:
    desc: Boot the seeded reference ARP server and run both conformance suites
    cmds:
      - agents/arp-reference/run.sh reports/arp


  # ---------------------------------------------------------------------------
  # A2A agent torture tasks
  # ---------------------------------------------------------------------------

  torture:a2a-go:
    desc: Run A2A v1.0 suite against the official Go SDK helloworld agent
    deps: [build]
    cmds:
      - agents/a2a-go/run.sh {{.SPEC}} {{.REPORTS}} ./bin/spec-torture

  torture:a2a-rs:
    desc: Run A2A v1.0 suite against the official Rust SDK helloworld agent
    deps: [build]
    cmds:
      - agents/a2a-rs/run.sh {{.SPEC}} {{.REPORTS}} ./bin/spec-torture

  torture:crush-a2a:
    desc: Run A2A v1.0 suite against crush-a2a (Crush with A2A plugin)
    deps: [build]
    cmds:
      - agents/crush-a2a/run.sh {{.SPEC}} {{.REPORTS}} ./bin/spec-torture

  # ---------------------------------------------------------------------------
  # ARP agent torture tasks
  # ---------------------------------------------------------------------------

  torture:awesometree:
    desc: Run ARP HTTP suite against live awesometree-daemon
    deps: [build]
    cmds:
      - agents/awesometree/run.sh specs/arp/spec-http.yaml reports/arp ./bin/spec-torture

  torture:awesometree-docker:
    desc: Run full ARP suite (HTTP + gRPC) in Docker with real agents
    deps: [build]
    cmds:
      - agents/awesometree/run-docker.sh reports/arp ./bin/spec-torture

  torture:all:
    desc: Run A2A v1.0 suite against all agents
    deps: [build]
    cmds:
      - task: torture:a2a-go
      - task: torture:a2a-rs
      - task: torture:crush-a2a
      - task: torture:awesometree

  # ---------------------------------------------------------------------------
  # A2A client torture tasks
  # ---------------------------------------------------------------------------

  torture:crush-a2a-client:
    desc: Run A2A v1.0 client conformance suite against crush-a2a
    deps: [build]
    cmds:
      - agents/crush-a2a-client/run.sh {{.REPORTS}} ./bin/spec-torture

  torture:hermes-client:
    desc: Run A2A + ARP client conformance suite against hermes-agent
    deps: [build]
    cmds:
      - agents/hermes/run.sh {{.REPORTS}} ./bin/a2a-mock

  torture:clients:
    desc: Run A2A v1.0 client suite against all clients
    deps: [build]
    cmds:
      - task: torture:crush-a2a-client
      - task: torture:hermes-client

  clean:
    desc: Remove build artifacts and cloned agent sources
    cmds:
      - rm -rf bin/
      - rm -rf agents/a2a-go/.build
      - rm -rf agents/a2a-rs/.build
      - rm -rf agents/crush-a2a/.crush-home
      - rm -rf agents/crush-a2a-client/.crush-home
      - rm -rf agents/hermes/.build
